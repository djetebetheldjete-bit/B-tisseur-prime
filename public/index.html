<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0E1B2E">
<title>Bâtisseur Archives</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0E1B2E; --ink2:#16273f; --teal:#147C8C; --deep:#0C5866; --gold:#D98A2B; --gold2:#e9a24a;
    --green:#2E8B6F; --red:#C0392B; --gray:#6B7686; --line:#dde4ee; --bg:#f3f6fa; --card:#ffffff;
    --f-display:"Sora","Segoe UI",system-ui,sans-serif; --f-body:"Instrument Sans","Segoe UI",system-ui,sans-serif;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ -webkit-text-size-adjust:100%; }
  body{ font-family:var(--f-body); color:var(--ink); background:var(--bg); line-height:1.5; min-height:100vh; }
  button,input,select,textarea{ font:inherit; color:inherit; }
  [hidden]{ display:none !important; }
  svg.i{ width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none; }

  /* ---------- Connexion ---------- */
  #login{ min-height:100vh; display:grid; place-items:center; padding:24px 16px; position:relative; overflow:hidden;
    background:radial-gradient(1200px 600px at 80% -10%,#1b3a5c 0%,transparent 60%),radial-gradient(900px 500px at -10% 110%,#0c5866 0%,transparent 55%),var(--ink); }
  #login .grain{ position:absolute; inset:0; background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px); background-size:44px 44px; mask-image:radial-gradient(circle at 50% 40%,#000 0%,transparent 72%); }
  .lcard{ position:relative; width:100%; max-width:400px; background:#fff; border-radius:22px; padding:30px 26px 26px; box-shadow:0 30px 80px rgba(0,0,0,.45); animation:rise .5s cubic-bezier(.2,.7,.2,1) both; }
  .lcard .logo{ width:62px; height:62px; border-radius:16px; display:block; margin:0 auto 14px; box-shadow:0 8px 22px rgba(20,124,140,.35); }
  .lcard h1{ font-family:var(--f-display); font-size:1.4rem; text-align:center; color:var(--ink); }
  .lcard .sub{ text-align:center; color:var(--gray); font-size:.92rem; margin:4px 0 20px; }
  .gold-line{ width:46px; height:3px; border-radius:3px; background:var(--gold); margin:10px auto 0; }
  label.f{ display:block; font-size:.8rem; font-weight:600; color:var(--ink2); margin:12px 0 5px; }
  .in{ width:100%; border:1.5px solid var(--line); border-radius:11px; padding:11px 13px; background:#fff; outline:none; transition:border-color .15s, box-shadow .15s; }
  .in:focus{ border-color:var(--teal); box-shadow:0 0 0 3px rgba(20,124,140,.15); }
  textarea.in{ resize:vertical; min-height:84px; }
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; border:0; border-radius:11px; padding:10px 16px; font-weight:600; cursor:pointer; transition:transform .12s, box-shadow .15s, background .15s; text-decoration:none; font-size:.92rem; }
  .btn:active{ transform:translateY(1px); }
  .btn.gold{ background:var(--gold); color:#2a1700; box-shadow:0 6px 16px rgba(217,138,43,.32); }
  .btn.gold:hover{ background:var(--gold2); }
  .btn.teal{ background:var(--teal); color:#fff; }
  .btn.teal:hover{ background:var(--deep); }
  .btn.ghost{ background:#fff; border:1.5px solid var(--line); color:var(--ink2); }
  .btn.ghost:hover{ border-color:var(--teal); color:var(--deep); }
  .btn.danger{ background:var(--red); color:#fff; }
  .btn.sm{ padding:7px 11px; font-size:.84rem; border-radius:9px; }
  .btn[disabled]{ opacity:.55; cursor:default; }
  .btn.full{ width:100%; margin-top:18px; padding:12px; }
  .err{ color:var(--red); font-size:.86rem; margin-top:10px; min-height:1.2em; }

  /* ---------- Application ---------- */
  header.top{ background:var(--ink); color:#fff; position:sticky; top:0; z-index:30; }
  header.top .in-h{ max-width:1160px; margin:0 auto; padding:12px 18px; display:flex; align-items:center; gap:12px; }
  header.top img{ width:36px; height:36px; border-radius:10px; }
  header.top .brand{ font-family:var(--f-display); font-weight:700; font-size:1.08rem; letter-spacing:.01em; line-height:1.1; }
  header.top .brand small{ display:block; font-family:var(--f-body); font-weight:500; font-size:.7rem; color:#9fb3cc; letter-spacing:.04em; text-transform:uppercase; margin-top:2px; }
  header.top .sp{ flex:1; }
  header.top .lg{ background:transparent; border:1px solid #2c4262; color:#cfe0f3; }
  header.top .lg:hover{ border-color:var(--gold); color:#fff; }
  .wrap{ max-width:1160px; margin:0 auto; padding:22px 18px 80px; }

  .stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  .stat{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 16px; position:relative; overflow:hidden; }
  .stat::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--teal); }
  .stat:nth-child(2)::before{ background:var(--gold); } .stat:nth-child(3)::before{ background:var(--green); } .stat:nth-child(4)::before{ background:var(--gray); }
  .stat .n{ font-family:var(--f-display); font-weight:700; font-size:1.55rem; color:var(--ink); }
  .stat .l{ color:var(--gray); font-size:.82rem; margin-top:1px; }

  .bar{ display:flex; gap:10px; margin:20px 0 16px; flex-wrap:wrap; align-items:center; }
  .search{ position:relative; flex:1 1 240px; }
  .search svg{ position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--gray); width:17px; height:17px; }
  .search .in{ padding-left:38px; }
  .bar select.in{ width:auto; min-width:170px; flex:0 1 auto; }

  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:16px; }
  .pc{ background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px 16px 14px; display:flex; flex-direction:column; gap:10px; transition:box-shadow .2s, transform .2s, border-color .2s; animation:rise .45s cubic-bezier(.2,.7,.2,1) both; }
  .pc:hover{ box-shadow:0 14px 34px rgba(14,27,46,.09); transform:translateY(-2px); border-color:#c9d6e6; }
  .pc .hd{ display:flex; gap:12px; align-items:flex-start; }
  .av{ width:42px; height:42px; border-radius:12px; display:grid; place-items:center; flex:none; color:#fff; font-family:var(--f-display); font-weight:700; font-size:.95rem; background:linear-gradient(135deg,var(--teal),var(--deep)); }
  .pc h3{ font-family:var(--f-display); font-size:1.02rem; line-height:1.25; word-break:break-word; }
  .pc .who{ color:var(--gray); font-size:.86rem; margin-top:2px; }
  .chips{ display:flex; gap:6px; flex-wrap:wrap; }
  .chip{ font-size:.74rem; font-weight:600; padding:3px 9px; border-radius:999px; background:#eaf3f5; color:var(--deep); border:1px solid #cfe3e7; }
  .chip.s{ background:#fdf3e3; color:#8a5410; border-color:#f3dcb4; }
  .chip.k{ background:#eef1f6; color:#47546a; border-color:#dde4ee; }
  .note{ color:#44546b; font-size:.88rem; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; white-space:pre-wrap; }
  .zip{ border:1.5px dashed #cdd8e6; border-radius:12px; padding:10px 12px; display:flex; align-items:center; gap:10px; background:#fafcfe; }
  .zip.ok{ border-style:solid; border-color:#bfe0d4; background:#f2faf6; }
  .zip .zi{ color:var(--green); } .zip:not(.ok) .zi{ color:var(--gray); }
  .zip .zt{ min-width:0; flex:1; }
  .zip .zn{ font-weight:600; font-size:.86rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .zip .zm{ color:var(--gray); font-size:.78rem; }
  .acts{ display:flex; gap:8px; flex-wrap:wrap; margin-top:auto; padding-top:2px; }
  .acts .sp{ flex:1; }
  .ib{ width:34px; height:34px; padding:0; border-radius:9px; }

  .empty{ text-align:center; padding:56px 20px; color:var(--gray); background:#fff; border:1.5px dashed var(--line); border-radius:20px; }
  .empty .big{ width:56px; height:56px; border-radius:16px; display:grid; place-items:center; margin:0 auto 12px; background:#eaf3f5; color:var(--teal); }
  .empty .big svg{ width:28px; height:28px; }
  .empty h2{ font-family:var(--f-display); font-size:1.15rem; color:var(--ink); margin-bottom:4px; }

  /* ---------- Fenêtres ---------- */
  .ov{ position:fixed; inset:0; background:rgba(8,16,28,.62); backdrop-filter:blur(3px); display:grid; place-items:center; padding:16px; z-index:60; overflow:auto; animation:fade .18s both; }
  .dlg{ width:100%; max-width:560px; background:#fff; border-radius:20px; padding:22px 22px 20px; box-shadow:0 30px 80px rgba(0,0,0,.4); animation:rise .3s cubic-bezier(.2,.7,.2,1) both; max-height:calc(100vh - 32px); overflow:auto; }
  .dlg h2{ font-family:var(--f-display); font-size:1.2rem; }
  .dlg .row2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .drop{ border:2px dashed #b9c9dc; border-radius:14px; padding:16px; text-align:center; color:var(--gray); cursor:pointer; background:#fafcfe; transition:all .15s; }
  .drop:hover,.drop.over{ border-color:var(--teal); background:#eef7f9; color:var(--deep); }
  .drop b{ color:var(--ink); }
  .drop .fn{ margin-top:6px; font-weight:600; color:var(--deep); word-break:break-all; }
  .hint{ font-size:.78rem; color:var(--gray); margin-top:5px; }
  .prog{ height:8px; border-radius:8px; background:#e6edf5; overflow:hidden; margin-top:12px; }
  .prog i{ display:block; height:100%; width:0; background:linear-gradient(90deg,var(--teal),var(--gold)); transition:width .15s; }
  .dlg .foot{ display:flex; gap:10px; justify-content:flex-end; margin-top:18px; flex-wrap:wrap; }

  #toast{ position:fixed; left:50%; bottom:22px; transform:translate(-50%,20px); background:var(--ink); color:#fff; padding:11px 18px; border-radius:12px; font-size:.9rem; opacity:0; pointer-events:none; transition:all .25s; z-index:80; box-shadow:0 10px 30px rgba(0,0,0,.3); max-width:90vw; }
  #toast.show{ opacity:1; transform:translate(-50%,0); }
  #toast.bad{ background:var(--red); }

  @keyframes rise{ from{ opacity:0; transform:translateY(12px); } to{ opacity:1; transform:none; } }
  @keyframes fade{ from{ opacity:0; } to{ opacity:1; } }
  @media (prefers-reduced-motion:reduce){ *{ animation:none !important; transition:none !important; } }
  @media (max-width:760px){
    .stats{ grid-template-columns:repeat(2,1fr); }
    .dlg .row2{ grid-template-columns:1fr; }
    .bar select.in{ flex:1 1 100%; }
  }
</style>
</head>
<body>

<!-- ============ CONNEXION ============ -->
<section id="login" hidden>
  <div class="grain"></div>
  <form class="lcard" id="loginForm" autocomplete="on">
    <img class="logo" src="/logo.png" alt="Bâtisseur">
    <h1>Bâtisseur Archives</h1>
    <div class="gold-line"></div>
    <p class="sub">Espace réservé au formateur</p>
    <label class="f" for="lmail">E-mail</label>
    <input class="in" id="lmail" type="email" name="email" autocomplete="username" required>
    <label class="f" for="lpass">Mot de passe</label>
    <input class="in" id="lpass" type="password" name="password" autocomplete="current-password" required>
    <div class="err" id="lerr" role="alert"></div>
    <button class="btn gold full" id="lgo" type="submit">Se connecter</button>
  </form>
</section>

<!-- ============ APPLICATION ============ -->
<div id="app" hidden>
  <header class="top"><div class="in-h">
    <img src="/logo.png" alt="">
    <div class="brand">Bâtisseur<small>Archives des projets</small></div>
    <div class="sp"></div>
    <button class="btn sm lg" id="logout" type="button"><svg class="i" viewBox="0 0 24 24"><path d="M9 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h4"/><path d="M16 8l4 4-4 4M20 12H9"/></svg><span>Déconnexion</span></button>
  </div></header>

  <main class="wrap">
    <div class="stats" id="stats"></div>

    <div class="bar">
      <div class="search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/></svg><input class="in" id="q" type="search" placeholder="Rechercher un projet"></div>
      <select class="in" id="fSession" aria-label="Filtrer par session"><option value="">Toutes les sessions</option></select>
      <select class="in" id="fZip" aria-label="Filtrer par ZIP"><option value="">Tous les projets</option><option value="zip">Avec version finale (ZIP)</option><option value="nozip">Sans ZIP</option></select>
      <a class="btn ghost" href="/api/export.csv" title="Exporter la liste"><svg class="i" viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg><span>Exporter</span></a>
      <button class="btn gold" id="newBtn" type="button"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Nouveau projet</span></button>
    </div>

    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden></div>
  </main>
</div>

<!-- ============ FENÊTRE PROJET ============ -->
<div class="ov" id="ov" hidden>
  <form class="dlg" id="pform" role="dialog" aria-modal="true" aria-labelledby="dt">
    <h2 id="dt">Nouveau projet</h2>
    <label class="f" for="pTitle">Titre du projet *</label>
    <input class="in" id="pTitle" maxlength="140" required>
    <div class="row2">
      <div><label class="f" for="pLearner">Apprenant</label><input class="in" id="pLearner" maxlength="140" autocomplete="off"></div>
      <div><label class="f" for="pSession">Session</label><input class="in" id="pSession" maxlength="140" list="sessList" autocomplete="off"><datalist id="sessList"></datalist></div>
    </div>
    <div class="row2">
      <div><label class="f" for="pKind">Type</label>
        <select class="in" id="pKind"><option value="site">Site web</option><option value="application">Application</option><option value="autre">Autre</option></select></div>
      <div><label class="f" for="pUrl">Lien en ligne</label><input class="in" id="pUrl" type="url" placeholder="https://" maxlength="500"></div>
    </div>
    <label class="f" for="pNotes">Notes</label>
    <textarea class="in" id="pNotes" maxlength="4000" placeholder="Technologies, remarques, état du projet…"></textarea>

    <label class="f">Version finale (fichier ZIP)</label>
    <div class="drop" id="drop" tabindex="0" role="button">
      <div><b>Glisse le ZIP ici</b> ou clique pour le choisir</div>
      <div class="fn" id="fname"></div>
      <input type="file" id="pFile" accept=".zip,application/zip,application/x-zip-compressed" hidden>
    </div>
    <div class="hint" id="zhint">50 Mo maximum. Un nouveau ZIP remplace l'ancien : seule la version finale est conservée.</div>
    <div class="prog" id="prog" hidden><i id="progBar"></i></div>
    <div class="err" id="perr" role="alert"></div>
    <div class="foot">
      <button class="btn ghost" type="button" id="pCancel">Annuler</button>
      <button class="btn gold" type="submit" id="pSave">Enregistrer</button>
    </div>
  </form>
</div>

<!-- ============ CONFIRMATION ============ -->
<div class="ov" id="cov" hidden>
  <div class="dlg" style="max-width:420px" role="alertdialog" aria-modal="true">
    <h2 id="ct">Supprimer ?</h2>
    <p id="cm" style="color:var(--gray);margin-top:8px;font-size:.93rem"></p>
    <div class="foot">
      <button class="btn ghost" type="button" id="cNo">Annuler</button>
      <button class="btn danger" type="button" id="cYes">Supprimer</button>
    </div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";
var $ = function(s){ return document.querySelector(s); };
var state = { projects:[], sessions:[], editing:null, file:null, busy:false };

var IC = {
  zip:'<svg class="i" viewBox="0 0 24 24"><path d="M4 7.5 12 4l8 3.5v9L12 20l-8-3.5z"/><path d="M4 7.5 12 11l8-3.5M12 11v9"/></svg>',
  link:'<svg class="i" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>',
  down:'<svg class="i" viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>',
  edit:'<svg class="i" viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17z"/><path d="M14 7l3 3"/></svg>',
  del:'<svg class="i" viewBox="0 0 24 24"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></svg>',
  box:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h18v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M2 4h20v4H2zM10 12h4"/></svg>'
};
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function fmtSize(n){ if(n==null) return ""; if(n<1024*1024) return Math.max(1,Math.round(n/1024))+" Ko"; return (n/1024/1024).toFixed(1).replace(".",",")+" Mo"; }
function fmtDate(s){ if(!s) return ""; var d=new Date(s); return isNaN(d)?"":d.toLocaleDateString("fr-FR",{day:"numeric",month:"short",year:"numeric"}); }
function initials(n){ var p=String(n||"").trim().split(/\s+/).filter(Boolean); if(!p.length) return "B"; return (p[0][0]+(p[1]?p[1][0]:"")).toUpperCase(); }
function toast(msg,bad){ var t=$("#toast"); t.textContent=msg; t.className="show"+(bad?" bad":""); clearTimeout(toast._t); toast._t=setTimeout(function(){ t.className=""; },3200); }
var KIND={site:"Site web",application:"Application",autre:"Autre"};

function api(method,url,body){
  return fetch(url,{method:method,headers:body?{"Content-Type":"application/json"}:{},body:body?JSON.stringify(body):undefined,credentials:"same-origin"})
    .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ if(r.status===401 && url!=="/api/login"){ showLogin(); throw new Error("Session expirée. Reconnecte-toi."); } if(!r.ok) throw new Error(j.error||"Erreur ("+r.status+")"); return j; }); });
}

/* ---------- connexion ---------- */
function showLogin(){ $("#app").hidden=true; $("#login").hidden=false; $("#lmail").focus(); }
function showApp(){ $("#login").hidden=true; $("#app").hidden=false; loadAll(); }
$("#loginForm").addEventListener("submit",function(e){
  e.preventDefault(); $("#lerr").textContent=""; $("#lgo").disabled=true;
  api("POST","/api/login",{email:$("#lmail").value,password:$("#lpass").value})
    .then(function(){ $("#lpass").value=""; showApp(); })
    .catch(function(er){ $("#lerr").textContent=er.message; })
    .then(function(){ $("#lgo").disabled=false; });
});
$("#logout").addEventListener("click",function(){ api("POST","/api/logout").catch(function(){}).then(function(){ state.projects=[]; showLogin(); }); });

/* ---------- données ---------- */
function loadAll(){
  return Promise.all([api("GET","/api/projects"),api("GET","/api/sessions")]).then(function(r){
    state.projects=r[0].projects; state.sessions=r[1].sessions; fillSessions(); render();
  }).catch(function(e){ toast(e.message,true); });
}
function fillSessions(){
  var cur=$("#fSession").value; var used={};
  state.projects.forEach(function(p){ if(p.session) used[p.session]=1; });
  $("#fSession").innerHTML='<option value="">Toutes les sessions</option>'+state.sessions.map(function(s){ return '<option value="'+esc(s.label)+'">'+esc(s.label)+(used[s.label]?"":" (vide)")+'</option>'; }).join("");
  $("#fSession").value=cur;
  $("#sessList").innerHTML=state.sessions.map(function(s){ return '<option value="'+esc(s.label)+'">'; }).join("");
}

/* ---------- affichage ---------- */
function render(){
  var P=state.projects;
  var withZip=P.filter(function(p){ return p.hasZip; }).length;
  var online=P.filter(function(p){ return p.url; }).length;
  var total=P.reduce(function(a,p){ return a+(p.zipSize||0); },0);
  $("#stats").innerHTML=
    '<div class="stat"><div class="n">'+P.length+'</div><div class="l">Projets archivés</div></div>'+
    '<div class="stat"><div class="n">'+withZip+'</div><div class="l">Versions finales (ZIP)</div></div>'+
    '<div class="stat"><div class="n">'+online+'</div><div class="l">Avec lien en ligne</div></div>'+
    '<div class="stat"><div class="n">'+(total?fmtSize(total):"0 Mo")+'</div><div class="l">Espace utilisé</div></div>';

  var q=$("#q").value.trim().toLowerCase(), fs=$("#fSession").value, fz=$("#fZip").value;
  var L=P.filter(function(p){
    if(fs && p.session!==fs) return false;
    if(fz==="zip" && !p.hasZip) return false;
    if(fz==="nozip" && p.hasZip) return false;
    if(q){ var h=(p.title+" "+p.learner+" "+p.session+" "+p.notes).toLowerCase(); if(h.indexOf(q)<0) return false; }
    return true;
  });
  $("#grid").innerHTML=L.map(function(p,i){
    var zip=p.hasZip
      ? '<div class="zip ok"><span class="zi">'+IC.zip+'</span><div class="zt"><div class="zn" title="'+esc(p.zipName)+'">'+esc(p.zipName)+'</div><div class="zm">Version finale · '+fmtSize(p.zipSize)+' · '+fmtDate(p.finalAt)+'</div></div></div>'
      : '<div class="zip"><span class="zi">'+IC.zip+'</span><div class="zt"><div class="zn">Pas encore de ZIP</div><div class="zm">Ajoute la version finale via « Modifier »</div></div></div>';
    return '<article class="pc" style="animation-delay:'+Math.min(i*40,320)+'ms" data-id="'+p.id+'">'+
      '<div class="hd"><div class="av">'+esc(initials(p.learner||p.title))+'</div><div style="min-width:0"><h3>'+esc(p.title)+'</h3><div class="who">'+esc(p.learner||"Apprenant non renseigné")+'</div></div></div>'+
      '<div class="chips">'+(p.session?'<span class="chip s">'+esc(p.session)+'</span>':"")+'<span class="chip k">'+esc(KIND[p.kind]||"Autre")+'</span></div>'+
      (p.notes?'<div class="note">'+esc(p.notes)+'</div>':"")+zip+
      '<div class="acts">'+
        (p.url?'<a class="btn ghost sm" href="'+esc(p.url)+'" target="_blank" rel="noopener noreferrer">'+IC.link+'<span>Ouvrir</span></a>':"")+
        (p.hasZip?'<a class="btn teal sm" href="/api/projects/'+p.id+'/zip">'+IC.down+'<span>Télécharger</span></a>':"")+
        '<span class="sp"></span>'+
        '<button class="btn ghost sm ib" data-act="edit" title="Modifier" aria-label="Modifier">'+IC.edit+'</button>'+
        '<button class="btn ghost sm ib" data-act="del" title="Supprimer" aria-label="Supprimer">'+IC.del+'</button>'+
      '</div></article>';
  }).join("");
  var em=$("#empty");
  if(!L.length){
    em.hidden=false;
    em.innerHTML = P.length
      ? '<div class="big">'+IC.box+'</div><h2>Aucun résultat</h2><p>Change la recherche ou les filtres.</p>'
      : '<div class="big">'+IC.box+'</div><h2>Ton archive est vide</h2><p>Ajoute le premier projet avec « Nouveau projet ».</p>';
  } else em.hidden=true;
}
["input","change"].forEach(function(ev){ $("#q").addEventListener(ev,render); $("#fSession").addEventListener(ev,render); $("#fZip").addEventListener(ev,render); });

$("#grid").addEventListener("click",function(e){
  var b=e.target.closest("[data-act]"); if(!b) return;
  var id=b.closest(".pc").getAttribute("data-id");
  var p=state.projects.filter(function(x){ return x.id===id; })[0]; if(!p) return;
  if(b.getAttribute("data-act")==="edit") openForm(p); else askDelete(p);
});

/* ---------- formulaire ---------- */
function openForm(p){
  state.editing=p||null; state.file=null; state.busy=false;
  $("#dt").textContent=p?"Modifier le projet":"Nouveau projet";
  $("#pTitle").value=p?p.title:""; $("#pLearner").value=p?p.learner:""; $("#pSession").value=p?p.session:($("#fSession").value||"");
  $("#pKind").value=p?p.kind:"site"; $("#pUrl").value=p?p.url:""; $("#pNotes").value=p?p.notes:"";
  $("#fname").textContent=""; $("#pFile").value=""; $("#perr").textContent=""; $("#prog").hidden=true; $("#progBar").style.width="0";
  $("#zhint").textContent = (p&&p.hasZip)
    ? "ZIP actuel : "+p.zipName+" ("+fmtSize(p.zipSize)+"). Choisis un nouveau fichier pour le remplacer : l'ancien sera supprimé."
    : "50 Mo maximum. Un nouveau ZIP remplace l'ancien : seule la version finale est conservée.";
  $("#pSave").disabled=false; $("#pCancel").disabled=false;
  $("#ov").hidden=false; setTimeout(function(){ $("#pTitle").focus(); },30);
}
function closeForm(){ if(state.busy) return; $("#ov").hidden=true; }
$("#newBtn").addEventListener("click",function(){ openForm(null); });
$("#pCancel").addEventListener("click",closeForm);
$("#ov").addEventListener("mousedown",function(e){ if(e.target===$("#ov")) closeForm(); });
document.addEventListener("keydown",function(e){ if(e.key==="Escape"){ if(!$("#cov").hidden) $("#cov").hidden=true; else closeForm(); } });

function pickFile(f){
  if(!f) return;
  if(!/\.zip$/i.test(f.name)){ $("#perr").textContent="Choisis un fichier .zip."; return; }
  if(f.size>50*1024*1024){ $("#perr").textContent="Ce ZIP dépasse 50 Mo ("+fmtSize(f.size)+")."; return; }
  $("#perr").textContent=""; state.file=f; $("#fname").textContent=f.name+" · "+fmtSize(f.size);
}
var drop=$("#drop");
drop.addEventListener("click",function(){ $("#pFile").click(); });
drop.addEventListener("keydown",function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); $("#pFile").click(); } });
$("#pFile").addEventListener("change",function(){ pickFile(this.files[0]); });
["dragenter","dragover"].forEach(function(ev){ drop.addEventListener(ev,function(e){ e.preventDefault(); drop.classList.add("over"); }); });
["dragleave","drop"].forEach(function(ev){ drop.addEventListener(ev,function(e){ e.preventDefault(); drop.classList.remove("over"); }); });
drop.addEventListener("drop",function(e){ pickFile(e.dataTransfer.files[0]); });

function uploadZip(id,file){
  return new Promise(function(resolve,reject){
    var x=new XMLHttpRequest();
    x.open("PUT","/api/projects/"+id+"/zip?name="+encodeURIComponent(file.name));
    x.setRequestHeader("Content-Type","application/zip");
    x.upload.onprogress=function(e){ if(e.lengthComputable) $("#progBar").style.width=Math.round(e.loaded/e.total*100)+"%"; };
    x.onload=function(){ var j={}; try{ j=JSON.parse(x.responseText); }catch(e){} if(x.status>=200&&x.status<300) resolve(j); else reject(new Error(j.error||"Échec du dépôt du ZIP ("+x.status+")")); };
    x.onerror=function(){ reject(new Error("Connexion perdue pendant le dépôt du ZIP.")); };
    x.send(file);
  });
}
$("#pform").addEventListener("submit",function(e){
  e.preventDefault(); if(state.busy) return;
  var body={title:$("#pTitle").value,learner:$("#pLearner").value,session:$("#pSession").value,kind:$("#pKind").value,url:$("#pUrl").value.trim(),notes:$("#pNotes").value};
  $("#perr").textContent=""; state.busy=true; $("#pSave").disabled=true; $("#pCancel").disabled=true;
  var ed=state.editing;
  (ed?api("PUT","/api/projects/"+ed.id,body):api("POST","/api/projects",body)).then(function(r){
    var id=r.project.id;
    if(!state.file) return null;
    $("#prog").hidden=false; $("#progBar").style.width="0";
    return uploadZip(id,state.file).catch(function(er){ throw new Error("Le projet est enregistré, mais "+er.message.charAt(0).toLowerCase()+er.message.slice(1)); });
  }).then(function(){
    state.busy=false; $("#ov").hidden=true; toast(ed?"Projet mis à jour.":"Projet ajouté à l'archive."); return loadAll();
  }).catch(function(er){
    state.busy=false; $("#pSave").disabled=false; $("#pCancel").disabled=false; $("#perr").textContent=er.message; loadAll();
  });
});

/* ---------- suppression ---------- */
var pendingDel=null;
function askDelete(p){
  pendingDel=p; $("#ct").textContent="Supprimer ce projet ?";
  $("#cm").textContent="« "+p.title+" »"+(p.hasZip?" et son ZIP seront":" sera")+" définitivement supprimé. Cette action est irréversible.";
  $("#cov").hidden=false; $("#cNo").focus();
}
$("#cNo").addEventListener("click",function(){ $("#cov").hidden=true; pendingDel=null; });
$("#cov").addEventListener("mousedown",function(e){ if(e.target===$("#cov")){ $("#cov").hidden=true; pendingDel=null; } });
$("#cYes").addEventListener("click",function(){
  var p=pendingDel; if(!p) return; $("#cYes").disabled=true;
  api("DELETE","/api/projects/"+p.id).then(function(){ $("#cov").hidden=true; toast("Projet supprimé."); return loadAll(); })
    .catch(function(er){ toast(er.message,true); }).then(function(){ $("#cYes").disabled=false; pendingDel=null; });
});

/* ---------- démarrage ---------- */
api("GET","/api/me").then(function(m){ if(m.authed) showApp(); else showLogin(); }).catch(function(){ showLogin(); });
})();
</script>
</body>
</html>
